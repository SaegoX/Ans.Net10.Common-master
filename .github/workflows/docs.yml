name: Deploy Docs

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps. deployment.outputs.page_url }}
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install DocFX
      run: dotnet tool install -g docfx

    - name: Build Project
      run: dotnet build Ans.Net10.Common.csproj # 

    - name: Build DocFX
      run: docfx _Docs/docfx.json --clean

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_Docs/_site' 

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4