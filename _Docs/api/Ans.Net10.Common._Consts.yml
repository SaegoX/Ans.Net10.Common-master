  assemblies:
  - Ans.Net10.Common
  namespace: Ans.Net10.Common
  remarks: >-
    Pattern:<br />

    <pre><code class="lang-csharp">^(?(")("[^"]+"@)|(([0-9a-z]((\\.(?!\\.))|[-!#\\$%&amp;'\\*\\+/=\\?\\^`\\{\\}\\|~\\w])*)(?&lt;=[0-9a-z])@))(?(\\[)(\\[(\\d{1,3}\\.){3}\\d{1,3}\\])|(([0-9a-z][-\\w]*[0-9a-z]*\\.)+[a-z0-9]{2,17}))$</code></pre><br />
        Explanation:<br />
        <pre><code class="lang-csharp">○ Match if at the beginning of the string.
    ○ Conditionally match one of two expressions depending on whether an initial expression matches.
        ○ Condition: Match '"'.
        ○ Matched: 1st capture group.
            ○ Match '"'.
            ○ Match a character other than '"' atomically at least once.
            ○ Match the string "\"@".
        ○ Not Matched: 2nd capture group.
            ○ 3rd capture group.
                ○ Match a character in the set [0-9a-z].
                ○ Loop greedily any number of times.
                    ○ 4th capture group.
                        ○ Match with 2 alternative expressions.
                            ○ 5th capture group.
                                ○ Match '.'.
                                ○ Zero-width negative lookahead.
                                    ○ Match '.'.
                            ○ Match a character in the set [!#-'*+\-/=?^`{-~\w].
            ○ Zero-width positive lookbehind.
                ○ Match a character in the set [0-9a-z] right-to-left.
            ○ Match '@'.
    ○ Conditionally match one of two expressions depending on whether an initial expression matches.
        ○ Condition: Match '['.
        ○ Matched: 6th capture group.
            ○ Match '['.
            ○ Loop exactly 3 times.
                ○ 7th capture group.
                    ○ Match a Unicode digit atomically at least 1 and at most 3 times.
                    ○ Match '.'.
            ○ Match a Unicode digit atomically at least 1 and at most 3 times.
            ○ Match ']'.
        ○ Not Matched: 8th capture group.
            ○ Loop greedily at least once.
                ○ 9th capture group.
                    ○ Match a character in the set [0-9a-z].
                    ○ Match a character in the set [\-\w] greedily any number of times.
                    ○ Match a character in the set [0-9a-z] atomically any number of times.
                    ○ Match '.'.
            ○ Match a character in the set [0-9a-z] atomically at least 2 and at most 17 times.
    ○ Match if at the end of the string or if before an ending newline.</code></pre>
  example: []
  syntax:
    content: >-
      [GeneratedRegex("^(?(\")(\"[^\"]+\"@)|(([0-9a-z]((\\.(?!\\.))|[-!#\\$%&'\\*\\+/=\\?\\^`\\{\\}\\|~\\w])*)(?<=[0-9a-z])@))(?(\\[)(\\[(\\d{1,3}\\.){3}\\d{1,3}\\])|(([0-9a-z][-\\w]*[0-9a-z]*\\.)+[a-z0-9]{2,17}))$")]

      public static Regex G_REGEX_EMAIL_STRICT()
