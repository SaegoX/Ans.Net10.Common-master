  type: Method
  source:
    id: GetPassed
    path: C:\REPOS\NET10\DocFx\Ans.Net10.Common-master\~classes\DateTimeHelper.cs
    startLine: 126
  assemblies:
  - Ans.Net10.Common
  namespace: Ans.Net10.Common
  summary: >-
    Возвращает дату (и время) события (для блога)

    - будет в будущих годах
    	d MMMM yyyy г.[ в H:mmmm] / MMMM d, yyyy[ at h:mmmm]
    - будет в этом году
    	d MMMM[ в H:mmmm] / MMMM d[ at h:mmmm]
    - завтра
    	завтра[ в H:mmmm] / Tomorrow[ at h:mmmm]
    - сегодня
    	сегодня[ в H:mmmm] / Today[ at h:mmmm]
    - вчера
    	вчера[ в H:mmmm] / Yesterday[ at H:mmmm]
    - было в этом году
    	d MMMM[ в H:mmmm] / MMMM d[ at h:mmmm]
    - было в прошлые годы
    	d MMMM yyyy г.[ в H:mmmm] / MMMM d, yyyy[ at h:mmmm]
  example: []
  syntax:
    content: public string GetPassed(DateTime datetime, bool addTime, bool useYesterdayTodayTomorrow)
    parameters:
    - id: datetime
      type: System.DateTime
      description: ''
    - id: addTime
      type: System.Boolean
      description: Добавить время
    - id: useYesterdayTodayTomorrow
      type: System.Boolean
      description: Использовать «вчера», «сегодня» и «завтра»
    return:
      type: System.String
    content.vb: Public Function GetPassed(datetime As Date, addTime As Boolean, useYesterdayTodayTomorrow As Boolean) As String
  overload: Ans.Net10.Common.DateTimeHelper.GetPassed*
  nameWithType.vb: DateTimeHelper.GetPassed(Date, Boolean, Boolean)
  fullName.vb: Ans.Net10.Common.DateTimeHelper.GetPassed(Date, Boolean, Boolean)
  name.vb: GetPassed(Date, Boolean, Boolean)
