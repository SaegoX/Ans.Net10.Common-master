- uid: Ans.Net10.Common.DateTimeHelper.GetPassed(System.DateTime,System.Boolean,System.Boolean)
  commentId: M:Ans.Net10.Common.DateTimeHelper.GetPassed(System.DateTime,System.Boolean,System.Boolean)
  id: GetPassed(System.DateTime,System.Boolean,System.Boolean)
